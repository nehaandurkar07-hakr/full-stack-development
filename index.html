
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1>Expense Tracker</h1>
            <p>Track your spending, one expense at a time.</p>
        </header>

        <section class="total-card">
            <p>Total Expenses</p>
            <h2 id="totalAmount">₹0.00</h2>
            <p id="expenseCount">0 expenses recorded</p>
        </section>

        <section class="panel">
            <h2 id="formTitle">Add New Expense</h2>

            <form id="expenseForm">
                <label for="title">Expense Title</label>
                <input id="title" type="text" maxlength="100"
                       placeholder="e.g. Lunch" required>

                <label for="amount">Amount (₹)</label>
                <input id="amount" type="number" min="0.01"
                       max="100000000" step="0.01"
                       placeholder="e.g. 150" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <div class="actions">
                    <button type="submit" id="saveButton">
                        Add Expense
                    </button>
                    <button type="button" id="cancelButton"
                            class="secondary" hidden>
                        Cancel
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="expenses-section">
            <h2>Expense History</h2>
            <div id="expenseList" class="expense-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
